<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drink It Admin V9</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f6f3;color:#17231c}.top{background:#087a3a;color:#fff;padding:18px 24px;font-size:24px;font-weight:800}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 16px #0000000d}.stat b{display:block;font-size:30px;margin-top:8px}.tabs{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.tabs button,button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.tabs button{background:#e2eee7}.tabs button.active,button.primary{background:#087a3a;color:#fff}.panel{margin-top:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;vertical-align:top}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8dfda;border-radius:9px;margin:5px 0 12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.danger{background:#ffe7e7;color:#a40000}.small{font-size:13px;color:#66736b}.hidden{display:none}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e7f4eb;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}table{font-size:13px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top{font-size:20px}}</style></head><body><div class="top">Drink It — Admin Panel V9</div><main class="wrap"><div class="grid"><div class="card stat">Products<b id="productCount">0</b></div><div class="card stat">Low Stock<b id="lowStock">0</b></div><div class="card stat">Orders<b id="orderCount">0</b></div><div class="card stat">Revenue<b id="revenue">₹0</b></div></div><div class="tabs"><button class="active" data-tab="products">Products</button><button data-tab="orders">Orders</button><button data-tab="add">Add Product</button></div><section id="products" class="panel"></section><section id="orders" class="panel hidden"></section><section id="add" class="panel hidden"><h2>Add Product</h2><div class="formgrid"><div><label>Name</label><input id="name"><label>Category</label><input id="category" placeholder="Soft Drinks"><label>Price</label><input id="price" type="number" min="0"></div><div><label>Stock</label><input id="stock" type="number" min="0"><label>Image URL</label><input id="image"><label>Original Price</label><input id="mrp" type="number" min="0"></div></div><button class="primary" onclick="addProduct()">Add Product</button></section></main><script>
let products=[],orders=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
async function load(){const [a,b]=await Promise.all([fetch('/api/products'),fetch('/api/orders')]);products=await a.json();orders=await b.json();render()}
function render(){productCount.textContent=products.length;lowStock.textContent=products.filter(p=>Number(p[7]??20)<10).length;orderCount.textContent=orders.length;revenue.textContent=money(orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+Number(o.total||0),0));let h='<h2>Products</h2><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>';products.forEach((p,i)=>h+=`<tr><td><b>${esc(p[0])}</b><br><span class="small">${esc(p[2])}</span></td><td>${esc(p[1])}</td><td><input type="number" value="${parseInt(p[3])}" onchange="edit(${i},{3:'₹'+(parseInt(this.value)||0)})"></td><td><input type="number" value="${p[7]??20}" onchange="edit(${i},{7:Math.max(0,parseInt(this.value)||0)})"></td><td><button class="danger" onclick="del(${i})">Delete</button></td></tr>`);products.innerHTML=h+'</table>';let oh='<h2>Orders</h2>';if(!orders.length)oh+='<p class="small">No orders yet.</p>';else{oh+='<table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>';orders.forEach((o,i)=>oh+=`<tr><td><b>#${esc(o.id)}</b><br><span class="small">${esc(o.date)}</span></td><td>${esc(o.name)}<br>${esc(o.mobile||'')}<br>${esc(o.address||'')}</td><td>${money(o.total)}</td><td><select onchange="status(${i},this.value)">${['New','Preparing','Out for delivery','Delivered','Cancelled'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`);oh+='</table>'}document.getElementById('orders').innerHTML=oh}
async function edit(i,b){await fetch('/api/products/'+i,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});load()}async function del(i){if(confirm('Delete this product?')){await fetch('/api/products/'+i,{method:'DELETE'});load()}}async function status(i,v){await fetch('/api/orders/'+i,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:v})});load()}async function addProduct(){const price=+document.getElementById('price').value||0;const p=[document.getElementById('name').value.trim(),document.getElementById('category').value.trim()||'Other',document.getElementById('price').value+'','₹'+price,'₹'+(+document.getElementById('mrp').value||price),document.getElementById('image').value.trim(),'NEW',+document.getElementById('stock').value||0];if(!p[0])return alert('Enter product name');await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});document.querySelectorAll('#add input').forEach(x=>x.value='');show('products');load()}
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id))}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));load();
</script></body></html>
